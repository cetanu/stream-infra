# RTMP Stream Multiplexer Configuration

[server]
listen = "0.0.0.0:1935"
health_listen = "0.0.0.0:8080"

# Target Destinations
# You can add as many target destinations as you need. Set enabled = false to temporarily disable a target.

[[targets]]
name = "YouTube Live"
url = "rtmp://a.rtmp.youtube.com/live2/YOUR_YOUTUBE_STREAM_KEY"
enabled = true

[[targets]]
name = "Twitch"
url = "rtmp://live.twitch.tv/app/YOUR_TWITCH_STREAM_KEY"
enabled = true

[[targets]]
name = "X (Twitter) Live"
url = "rtmp://va.pscp.tv/x/YOUR_X_STREAM_KEY"
enabled = false
