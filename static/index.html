<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Infrastructure Proxy</title>
    <meta name="description" content="Configuration dashboard for the RTMP Stream Multiplexer.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #318bf8;
            --danger: #f85149;
            --success: #238636;
            --glass-bg: rgba(22, 27, 34, 0.7);
            --glass-border: rgba(48, 54, 61, 0.5);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(88, 166, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(137, 87, 229, 0.05), transparent 25%);
        }

        header {
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-weight: 700;
            font-size: 1.75rem;
            background: linear-gradient(90deg, #58a6ff, #8957e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition);
        }

        .card:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
        }
        
        .form-col {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .target-item {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            transition: var(--transition);
        }
        
        .target-item:hover {
            border-color: var(--accent);
        }

        .target-inputs {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .target-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            outline: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid transparent;
        }

        .btn-danger:hover {
            background-color: rgba(248, 81, 73, 0.1);
            border-color: var(--danger);
        }

        .actions-panel {
            position: sticky;
            bottom: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        #toast.success {
            border-left: 4px solid var(--success);
        }

        #toast.error {
            border-left: 4px solid var(--danger);
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            background: var(--surface);
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        
        .metric-card:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Stream Infra</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">RTMP Multiplexer Configuration</p>
    </header>

    <div class="container">
        <!-- Metrics Dashboard -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value" id="metric_streams">0</div>
                <div class="metric-label">Active Streams</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="metric_relays">0</div>
                <div class="metric-label">Active Relays</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="metric_active_conn">0</div>
                <div class="metric-label">Active Connections</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="metric_total_conn">0</div>
                <div class="metric-label">Total Connections</div>
            </div>
        </div>

        <form id="configForm">
            
            <!-- Server Settings -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Server Settings</div>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="server_listen">RTMP Listen Address</label>
                            <input type="text" id="server_listen" placeholder="0.0.0.0:1935">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="health_listen">Health/API Listen Address</label>
                            <input type="text" id="health_listen" placeholder="127.0.0.1:8080">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notifications -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Notifications</div>
                </div>
                <div class="form-group">
                    <label for="live_message">Live Message (Sent when stream starts)</label>
                    <textarea id="live_message" placeholder="Stream is LIVE!"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="discord_webhook">Discord Webhook URL (Optional)</label>
                            <input type="password" id="discord_webhook" placeholder="https://discord.com/api/webhooks/..." 
                                   onfocus="this.type='url'" onblur="this.type='password'">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="generic_webhook">Generic Webhook URL (Optional)</label>
                            <input type="password" id="generic_webhook" placeholder="https://api.example.com/webhook"
                                   onfocus="this.type='url'" onblur="this.type='password'">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Targets -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">RTMP Targets</div>
                    <button type="button" class="btn-secondary" onclick="addTarget()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        Add Target
                    </button>
                </div>
                
                <div id="targetsContainer">
                    <!-- Targets injected here -->
                </div>
                <div id="emptyTargets" class="empty-state" style="display: none;">
                    No targets configured. Stream will be ingested locally without forwarding.
                </div>
            </div>

            <div class="actions-panel">
                <div style="flex: 1; display: flex; gap: 1rem;">
                    <button type="button" class="btn-secondary" onclick="testWebhooks()" id="testWebhooksBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        Test Webhooks
                    </button>
                    <button type="button" class="btn-secondary" onclick="testStream()" id="testStreamBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        Test Stream (15s)
                    </button>
                </div>
                <button type="button" class="btn-secondary" onclick="fetchConfig()">Revert</button>
                <button type="submit" class="btn-primary" id="saveBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    Save Configuration
                </button>
            </div>
        </form>
    </div>

    <div id="toast">Message</div>

    <script>
        let currentTargets = [];

        async function testWebhooks() {
            const btn = document.getElementById('testWebhooksBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/test-webhooks', { method: 'POST' });
                if (res.ok) showToast('Webhook test dispatched!');
                else showToast('Failed to test webhooks', 'error');
            } catch (err) {
                showToast('Network error', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function testStream() {
            const btn = document.getElementById('testStreamBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/test-stream', { method: 'POST' });
                if (res.ok) showToast('Test stream running for 15s!');
                else showToast('Failed to start test stream', 'error');
            } catch (err) {
                showToast('Network error', 'error');
            } finally {
                setTimeout(() => btn.disabled = false, 15000);
            }
        }

        async function fetchConfig() {
            try {
                const response = await fetch('/api/config');
                if (!response.ok) throw new Error('Failed to fetch config');
                const config = await response.json();
                
                // Populate Server
                document.getElementById('server_listen').value = config.server.listen || '0.0.0.0:1935';
                document.getElementById('health_listen').value = config.server.health_listen || '127.0.0.1:8080';
                
                // Populate Notifications
                document.getElementById('live_message').value = config.notifications.live_message || 'Stream is LIVE';
                document.getElementById('discord_webhook').value = config.notifications.discord_webhook || '';
                document.getElementById('generic_webhook').value = config.notifications.webhook_url || '';
                
                // Populate Targets
                currentTargets = config.targets || [];
                renderTargets();
                
            } catch (err) {
                showToast('Error loading configuration', 'error');
                console.error(err);
            }
        }

        function renderTargets() {
            const container = document.getElementById('targetsContainer');
            const emptyState = document.getElementById('emptyTargets');
            
            container.innerHTML = '';
            
            if (currentTargets.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            currentTargets.forEach((target, index) => {
                const el = document.createElement('div');
                el.className = 'target-item';
                el.innerHTML = `
                    <div class="target-inputs">
                        <div class="form-row">
                            <div class="form-col">
                                <label>Target Name</label>
                                <input type="text" value="${target.name}" onchange="updateTarget(${index}, 'name', this.value)" placeholder="e.g. Twitch, YouTube" required>
                            </div>
                            <div class="form-col" style="flex: 2;">
                                <label>RTMP URL (Stream Key)</label>
                                <input type="password" value="${target.url}" 
                                       onfocus="this.type='url'" onblur="this.type='password'"
                                       onchange="updateTarget(${index}, 'url', this.value)" placeholder="rtmp://live.twitch.tv/app/stream_key" required>
                            </div>
                            <div class="form-col" style="flex: 2;">
                                <label>Public Stream URL (Optional)</label>
                                <input type="url" value="${target.public_url || ''}" onchange="updateTarget(${index}, 'public_url', this.value)" placeholder="https://twitch.tv/mychannel">
                            </div>
                        </div>
                    </div>
                    <div class="target-actions">
                        <label>Enabled</label>
                        <label class="toggle-switch">
                            <input type="checkbox" ${target.enabled ? 'checked' : ''} onchange="updateTarget(${index}, 'enabled', this.checked)">
                            <span class="slider"></span>
                        </label>
                        <button type="button" class="btn-danger" onclick="removeTarget(${index})" title="Remove Target">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
                        </button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function addTarget() {
            currentTargets.push({
                name: 'New Target',
                url: '',
                enabled: true
            });
            renderTargets();
            
            // Scroll to bottom of targets
            const container = document.getElementById('targetsContainer');
            if(container.lastElementChild) {
                container.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateTarget(index, field, value) {
            currentTargets[index][field] = value;
        }

        function removeTarget(index) {
            if(confirm('Are you sure you want to remove this target?')) {
                currentTargets.splice(index, 1);
                renderTargets();
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            const newConfig = {
                server: {
                    listen: document.getElementById('server_listen').value,
                    health_listen: document.getElementById('health_listen').value
                },
                notifications: {
                    live_message: document.getElementById('live_message').value,
                    discord_webhook: document.getElementById('discord_webhook').value || null,
                    webhook_url: document.getElementById('generic_webhook').value || null
                },
                targets: currentTargets
            };

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newConfig)
                });

                if (response.ok) {
                    showToast('Configuration saved successfully!');
                } else {
                    const text = await response.text();
                    showToast(text || 'Failed to save configuration', 'error');
                }
            } catch (err) {
                showToast('Network error while saving', 'error');
                console.error(err);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Initial load
        fetchConfig();
        
        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('metric_streams').textContent = data.active_streams;
                    document.getElementById('metric_relays').textContent = data.active_relays;
                    document.getElementById('metric_active_conn').textContent = data.active_connections;
                    document.getElementById('metric_total_conn').textContent = data.total_connections;
                }
            } catch (err) {
                console.error('Failed to fetch metrics', err);
            }
        }

        // Poll metrics every 2 seconds
        setInterval(fetchMetrics, 2000);
        fetchMetrics();
    </script>
</body>
</html>
